[package]
name = "tileling"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Ultra-lightweight window tiling for XFCE on Debian: layout picker, preview and tiling assistant"
license = "MIT"
readme = "README.md"
keywords = ["tiling", "x11", "xfce", "window-manager", "debian"]
categories = ["gui"]
repository = "https://github.com/alexandreravelli/tileling"
homepage = "https://github.com/alexandreravelli/tileling"
documentation = "https://docs.rs/tileling"
# What crates.io gets: the sources, the tests and the files the package uses.
include = [
    "/src",
    "/tests",
    "/examples",
    "/config/default.toml",
    "/data",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[dependencies]
anyhow = "1"
thiserror = "2"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
x11rb = { version = "0.14", features = ["image", "randr", "shape", "xinput"] }

[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Tileling converts between X11's i16/u16, pixel i32/u32 and tiny-skia's f32 all the time.
# Screen coordinates and sizes stay far inside every one of these ranges, and checked
# conversions at each step would hide the geometry.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# x, y, w, h, r, g, b are the clearest names in drawing code.
many_single_char_names = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.deb]
maintainer = "alexandreravelli"
section = "x11"
priority = "optional"
depends = "$auto"
extended-description = """\
Tileling brings Ubuntu 26.10's window tiling to XFCE and other X11 desktops: drag a window \
towards the top of the screen to open a layout picker, drop it on a zone (halves, quarters, \
thirds), see a preview before you release, then pick the windows that fill the other zones."""
assets = [
    ["target/release/tileling", "usr/bin/", "755"],
    ["data/tileling.desktop", "etc/xdg/autostart/", "644"],
    ["config/default.toml", "usr/share/doc/tileling/config.example.toml", "644"],
    ["README.md", "usr/share/doc/tileling/", "644"],
]

[dev-dependencies]
tempfile = "3"
x11rb = { version = "0.14", features = ["xtest"] }
