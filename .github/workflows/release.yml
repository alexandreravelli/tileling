name: Release

# Publishes a release whenever main carries a version (Cargo.toml) that has no release yet:
# merge the release pull request that release-plz opens (or bump `version` and add a
# CHANGELOG.md section by hand), and push to main. Every CI check runs first, and nothing is
# published if one fails.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.version.outputs.released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: check
    if: needs.check.outputs.released == 'false'
    uses: ./.github/workflows/ci.yml

  release:
    needs: [check, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # A static (musl) binary, built and packaged on Debian 13.
    container: debian:trixie
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TARGET: x86_64-unknown-linux-musl
    steps:
      - name: Install build tools
        run: |
          apt-get update
          # dpkg-dev provides dpkg-shlibdeps, which cargo-deb runs.
          apt-get install -y --no-install-recommends ca-certificates curl gcc libc6-dev git dpkg-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - name: Build the binary and the Debian package
        run: |
          cargo build --release --locked --target "$TARGET"
          cargo install cargo-deb --locked --version 3.8.0
          cargo deb --no-build --target "$TARGET"
      - name: Prepare release files
        run: |
          mkdir dist
          cp target/"$TARGET"/debian/*.deb dist/
          # The same package under a name that does not change, for the install instructions.
          cp target/"$TARGET"/debian/*.deb dist/tileling_amd64.deb
          tar czf "dist/tileling-v${VERSION}-x86_64-linux.tar.gz" \
            -C target/"$TARGET"/release tileling \
            -C "$GITHUB_WORKSPACE" README.md LICENSE CHANGELOG.md config/default.toml data/tileling.desktop
          (cd dist && sha256sum -- * > SHA256SUMS)
          # Release notes: this version's section of the changelog ("## [1.2.3] - date" or
          # "## [1.2.3](compare link) - date"), without the link definitions at the end.
          awk -v v="[$VERSION]" 'index($0, "## " v) == 1 {on=1; next} /^## / {on=0} /^\[.*\]: / {next} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Tileling v${{ env.VERSION }}
          body_path: notes.md
          files: dist/*

  # Off until the PUBLISH_CRATE repository variable is "true": publish the first version by
  # hand (`cargo publish`), add this repository and release.yml as a trusted publisher on
  # crates.io, then set the variable. No token is stored: crates.io trusts the workflow.
  crates-io:
    name: Publish to crates.io
    needs: [check, release]
    if: vars.PUBLISH_CRATE == 'true' && needs.check.outputs.released == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
